name: Publish Docker image

# Builds the multi-arch server image and pushes it to GHCR on every
# version tag, so self-hosters never have to build from source.
# The image is only pushed after the test job (test.yml: go vet, go test,
# browser tests) passes, and only from a v* tag: a manual run on a branch
# runs the tests and skips the publish (audit 137 WS-8, team task 141).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # one publish at a time: two tags pushed together must not race for :latest (task 142)
    concurrency:
      group: publish-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ steps.meta.outputs.version }}
