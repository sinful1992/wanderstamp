name: Build Android APK

# Builds a sideloadable Wanderstamp APK in the cloud — no local Android toolchain
# needed. Run manually from the Actions tab after setting the 4 signing secrets
# (see app/README.md).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('app/src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Your own server, app id and name come from repo settings so the public
      # source stays generic. Unset = build the example config as committed.
      # APP_ID is the Android application id: keep it stable across builds or
      # phones will install the new APK beside the old one instead of upgrading.
      #
      # APP_URL is a SECRET, not a variable: on a public repo, run logs are
      # world-readable and variables appear in them verbatim, so a private
      # server address set as a variable is published. Secrets are masked.
      # Nothing in this step echoes the substituted config, for the same reason.
      # NOTE: the built APK still embeds APP_URL, and artifacts of a public repo
      # are downloadable by anyone — don't build a private-server APK here.
      - name: Point the app at your server
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_ID: ${{ vars.APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          set -e
          [ -n "$APP_URL" ]  && sed -i "s#https://wanderstamp.example.com#$APP_URL#g" src-tauri/tauri.conf.json dist/index.html
          [ -n "$APP_ID" ]   && sed -i "s#\"identifier\": \"app.wanderstamp\"#\"identifier\": \"$APP_ID\"#" src-tauri/tauri.conf.json
          [ -n "$APP_NAME" ] && sed -i "s#\"productName\": \"Wanderstamp\"#\"productName\": \"$APP_NAME\"#; s#\"title\": \"Wanderstamp\"#\"title\": \"$APP_NAME\"#" src-tauri/tauri.conf.json \
                             && sed -i "s#<title>Wanderstamp</title>#<title>$APP_NAME</title>#; s#<h1>Wanderstamp</h1>#<h1>$APP_NAME</h1>#" dist/index.html
          # Report only whether substitution happened — never the value.
          grep -q "wanderstamp.example.com" src-tauri/tauri.conf.json \
            && echo "server url: example config (APP_URL unset)" \
            || echo "server url: overridden from APP_URL"

      - name: Init Android project
        run: cargo tauri android init

      - name: Build APK
        run: cargo tauri android build --apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android -name "*-universal-release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          fi
          echo "Found APK: $APK"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No signing secrets set. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (see app/make-keystore.sh)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hm.keystore"
          "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/hm.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/wanderstamp.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/wanderstamp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wanderstamp-apk
          path: ${{ runner.temp }}/wanderstamp.apk
          if-no-files-found: error
