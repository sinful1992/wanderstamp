name: Build Android APK

# Builds a sideloadable Wanderstamp APK in the cloud — no local Android toolchain
# needed. Run manually from the Actions tab after setting the 4 signing secrets
# (see app/README.md), or push an `app-vX.Y.Z` tag to publish the APK as a
# GitHub release. Server tags (`vX.Y.Z`) build the Docker image instead, so the
# two release lines never collide.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('app/src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Nothing is substituted into the app here, on purpose. The APK is built
      # in public: its logs and its artifacts are world-readable, so anything
      # baked in at build time — a server address above all — is published
      # along with it. The shell asks for the server address on first run
      # instead, and keeps it on the phone.
      #
      # Rebranding a fork (name, application id) is a source edit in
      # tauri.conf.json, not a build-time secret.

      - name: Init Android project
        run: cargo tauri android init

      - name: Build APK
        run: cargo tauri android build --apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android -name "*-universal-release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          fi
          echo "Found APK: $APK"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No signing secrets set. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (see app/make-keystore.sh)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hm.keystore"
          "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/hm.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/wanderstamp.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/wanderstamp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wanderstamp-apk
          path: ${{ runner.temp }}/wanderstamp.apk
          if-no-files-found: error

      # Tag builds publish the APK; dispatch builds stop at the artifact above.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          cp "$RUNNER_TEMP/wanderstamp.apk" "$RUNNER_TEMP/wanderstamp-$TAG.apk"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Sideloadable Android APK — a thin native shell around your own Wanderstamp
          server.

          Install it, then enter the address of your server on first run. Nothing is
          baked into the build, so this same APK works for everyone; the address stays
          on the phone.

          Requires Android 7.0 (API 24) or newer, and unknown-sources install — the app
          is not on any store.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/wanderstamp-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wanderstamp Android ${TAG#app-}" \
            --notes-file "$RUNNER_TEMP/notes.md"
