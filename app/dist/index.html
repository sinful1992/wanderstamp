<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanderstamp</title>
<style>
  /* The passport cover, redrawn standalone: this page ships inside the APK and
     must render before the server is even known, so it carries its own copy of
     the palette, the two type voices, and the stamp face itself. */
  @font-face {
    font-family: "Staatliches";
    src: url("staatliches.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --paper: #f6f1e3;
    --navy: #1c3652;
    --navy-2: #142639;
    --gold: #c6a45e;
    --on-cover: #e7ddc6;
    --cover: radial-gradient(120% 100% at 50% 0%, var(--navy) 0%, var(--navy-2) 70%);
    --stamp: "Staatliches", "Roboto Condensed", "Arial Narrow", sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --control: 600 13px/1.1 var(--body);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cover); color: var(--on-cover); font-family: var(--body);
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  form { display: flex; flex-direction: column; width: 100%; max-width: 340px; }
  .cover-eyebrow {
    margin: 0; text-align: center;
    color: var(--gold); font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  }
  .cover-crest {
    align-self: center; margin: 6px 0 2px;
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid var(--gold); color: var(--gold);
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .cover-title {
    margin: 2px 0 4px; text-align: center;
    font-family: var(--stamp); font-weight: 400;
    font-size: 40px; line-height: .95; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  .cover-rule { align-self: center; width: 72px; margin-bottom: 14px; border-top: 3px double var(--gold); opacity: .7; }
  p.lede { margin: 0 0 14px; text-align: center; font-size: 13.5px; line-height: 1.5; opacity: .85; }
  input {
    font: inherit; font-size: 16px; /* 16px: anything smaller zooms the page on focus */
    background: var(--paper); color: #26221c;
    border: 1px solid transparent; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  }
  input:focus { outline: none; box-shadow: 0 0 0 2px rgba(198, 164, 94, .5); }
  button {
    font: var(--control); letter-spacing: 1.4px; text-transform: uppercase;
    border: 0; border-radius: 8px; padding: 13px 16px; cursor: pointer;
    background: var(--gold); color: var(--navy-2);
  }
  button.quiet { background: none; color: var(--on-cover); border: 1px solid rgba(198,164,94,.45); margin-top: 8px; }
  button:active { opacity: .85; }
  .msg { margin: 0 0 12px; text-align: center; font-size: 13px; line-height: 1.45; }
  .msg.bad { color: #e8a89e; }
  .hint { margin: 14px 0 0; text-align: center; font-size: 11.5px; letter-spacing: .3px; opacity: .55; line-height: 1.5; }
  /* The connecting state reuses the crest as the only moving part. */
  .waiting .cover-crest { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .waiting .cover-crest { animation: none; } }
</style>
</head>
<body>

<form id="setup" hidden>
  <p class="cover-eyebrow">Family travel record</p>
  <div class="cover-crest" aria-hidden="true">✈</div>
  <h1 class="cover-title">Wander<br>stamp</h1>
  <div class="cover-rule" aria-hidden="true"></div>

  <p class="lede" id="lede">Enter the address of your Wanderstamp server.</p>
  <p class="msg bad" id="error" hidden></p>

  <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off"
         spellcheck="false" placeholder="wanderstamp.example.com" required>
  <button type="submit" id="go">Connect</button>
  <button type="button" class="quiet" id="forget" hidden>Use a different address</button>

  <p class="hint">The phone needs to reach the server: same Wi‑Fi, a VPN such as
    Tailscale, or a public address. Nothing is sent anywhere else.</p>
</form>

<script>
// The shell is generic: the server address is entered here on first run and kept
// in this page's own localStorage, never baked into the APK at build time.
(function () {
  var KEY = 'wanderstamp.server';
  var setup = document.getElementById('setup');
  var input = document.getElementById('url');
  var err = document.getElementById('error');
  var lede = document.getElementById('lede');
  var go = document.getElementById('go');
  var forget = document.getElementById('forget');

  function store(get, val) {
    // Private-mode webviews can throw on access; the app still works, it just
    // asks for the address each launch.
    try { return val === undefined ? localStorage.getItem(get) : localStorage.setItem(get, val); }
    catch (e) { return null; }
  }
  function flag(get, val) {
    try { return val === undefined ? sessionStorage.getItem(get) : sessionStorage.setItem(get, val); }
    catch (e) { return null; }
  }

  // "wanderstamp.example.com" and "server:8095" are what people actually type.
  // new URL() is too forgiving to validate with on its own — it accepts
  // "not a url at all" by percent-encoding the spaces into a path — so the
  // hostname is checked separately.
  function normalise(raw) {
    var s = (raw || '').trim().replace(/\/+$/, '');
    if (!s || /\s/.test(s)) return null;
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);
      var host = u.hostname;
      var ok = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$/i.test(host)
            || /^\[[0-9a-f:.]+\]$/i.test(host);
      if (!ok) return null;
      return u.origin + u.pathname.replace(/\/+$/, '');
    } catch (e) { return null; }
  }

  // Reachability only — the response is opaque (cross-origin), so a resolved
  // promise means the server answered, not what it answered.
  function reachable(url) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { ctl && ctl.abort(); }, 8000);
    return fetch(url + '/', { mode: 'no-cors', cache: 'no-store', signal: ctl && ctl.signal })
      .then(function () { clearTimeout(timer); return true; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  function show(opts) {
    document.body.classList.remove('waiting');
    lede.textContent = opts.lede;
    err.hidden = !opts.error;
    if (opts.error) err.textContent = opts.error;
    input.value = opts.value || '';
    go.textContent = opts.button || 'Connect';
    forget.hidden = !opts.canForget;
    setup.hidden = false;
    if (!opts.value) input.focus();
  }

  function connect(url) {
    setup.hidden = false;
    document.body.classList.add('waiting');
    lede.textContent = 'Connecting to ' + new URL(url).host + '…';
    err.hidden = true;
    input.hidden = go.hidden = forget.hidden = true;
    reachable(url).then(function (ok) {
      input.hidden = go.hidden = false;
      if (ok) {
        store(KEY, url);
        // A plain assignment keeps the launcher in history, so Android's back
        // button returns here; the flag stops it bouncing straight out again.
        flag('left', '1');
        location.href = url;
        return;
      }
      show({
        lede: 'Check the phone’s connection, or the address.',
        error: 'Can’t reach ' + new URL(url).host,
        value: url, button: 'Try again', canForget: true
      });
    });
  }

  setup.addEventListener('submit', function (e) {
    e.preventDefault();
    var url = normalise(input.value);
    if (!url) {
      show({ lede: lede.textContent, error: 'That doesn’t look like an address.', value: input.value, canForget: !!store(KEY) });
      return;
    }
    connect(url);
  });

  forget.addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    show({ lede: 'Enter the address of your Wanderstamp server.' });
  });

  var saved = store(KEY);
  var cameBack = flag('left') === '1';
  try { sessionStorage.removeItem('left'); } catch (e) {}

  if (saved && !cameBack) connect(saved);
  else if (saved) show({ lede: 'Connect again, or point the app somewhere else.', value: saved, canForget: true });
  else show({ lede: 'Enter the address of your Wanderstamp server.' });
})();
</script>
</body>
</html>
