[package]
name = "wanderstamp-app"
version = "1.1.0"
description = "Wanderstamp — family travel log"
authors = ["sinful1992"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the Android (and desktop) entry points call into.
[lib]
name = "wanderstamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
